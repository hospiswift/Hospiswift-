--a:#128A28;--ad:#0C6B1E;--al:#E3F7E8}
body.hosp{--a:#0B63C9;--ad:#084A99;--al:#E3F0FF;--bg:#EEF3F9;--line:#D6DEE9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
header{background:var(--a);color:#fff;padding:16px;border-radius:0 0 22px 22px;transition:background .3s}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:20px}.back{color:#fff;font-size:14px;font-weight:600;text-decoration:none;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px}
header p{font-size:14px;opacity:.92;margin-top:10px}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:12px;overflow:hidden;display:none}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
main{padding:16px 16px 40px}
h2{font-size:20px;font-weight:800;margin-bottom:4px}.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.pick{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.pick b{font-size:18px;display:block;margin:6px 0 4px}.pick span{font-size:14px;color:var(--mute)}
.pick.p{border-color:var(--green)}.pick.h{border-color:var(--blue)}
.pick .em{font-size:28px}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.perks div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px;font-weight:600}
.f{margin-bottom:14px}.f label,.f .l{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.f small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.f input[type=text],.f input[type=tel],.f input[type=email],.f select,.f textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.f.err input,.f.err select,.f.err .up{border-color:var(--red)}
.msg{color:var(--red);font-size:12px;font-weight:600;margin-top:4px}
.up{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px dashed var(--a);border-radius:12px;padding:12px;background:#fff;cursor:pointer;font-weight:600;color:var(--ad);font-size:14px}
.up input{display:none}.up .ok{color:var(--green);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--a);flex:none}
.f.err .chk{border-color:var(--red)}
.doc{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.doc input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px}
.doc .rm{color:var(--red);font-weight:700;font-size:13px}
.btn{background:var(--a);color:#fff;font-weight:700;padding:14px;border-radius:12px;width:100%;margin-top:6px}
.btn.out{background:#fff;color:var(--a);border:1.5px solid var(--a)}
.row{display:flex;gap:10px}.row>*{flex:1}
.rev{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
.rev h3{font-size:14px;color:var(--ad);margin-bottom:6px}.rev div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.rev span{color:var(--mute)}.rev b{text-align:right;word-break:break-word}
.steps{list-style:none;margin:14px 0}
.steps li{padding:10px 0 10px 32px;position:relative;color:var(--mute);font-size:15px}
.steps li:before{content:"";position:absolute;left:4px;top:13px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff}
.steps li.done{color:var(--ink);font-weight:600}.steps li.done:before{background:var(--a);border-color:var(--a)}
.steps li.now:before{border-color:var(--a);box-shadow:0 0 0 4px var(--al)}
.ref{background:var(--al);color:var(--ad);font-weight:800;border-radius:12px;padding:10px;text-align:center;letter-spacing:1px}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:16px}
main.tp{padding-bottom:104px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-top:1.5px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);padding:6px 0;position:relative}
.tabs button.on{color:var(--a)}.tabs svg{width:24px;height:24px}
.tabs .bd{position:absolute;top:0;right:24%;background:var(--red);color:#fff;font-size:11px;border-radius:99px;min-width:18px;line-height:18px;padding:0 5px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.r{display:flex;gap:10px;align-items:center;justify-content:space-between}
.t{font-weight:700}.s{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--al);color:var(--ad);white-space:nowrap}
.tag.rx{background:#FFF1DC;color:#9A5B00}.tag.red{background:#FDE8E8;color:var(--red)}.tag.gr{background:#ECEDEF;color:var(--mute)}
.sw{width:52px;height:30px;border-radius:99px;background:#C8CBD0;position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-checked=true]{background:var(--a)}.sw[aria-checked=true] i{left:25px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:20px;margin-top:2px}
.btn.sm{padding:9px 14px;width:auto;margin:0;font-size:14px}.btn.red{background:var(--red)}
a.btn{display:block;text-align:center;text-decoration:none}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1;margin:0;padding:11px}
.alert{background:#FDE8E8;border:1.5px solid var(--red);border-radius:16px;padding:14px;margin-bottom:12px}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
.sl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.slotb{padding:9px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.slotb.on{background:var(--a);border-color:var(--a);color:#fff}.slotb.off{color:var(--mute);text-decoration:line-through}
.slotb.bk{background:var(--al);color:var(--ad);border-color:var(--al)}.slotb small{display:block;font-size:10px;font-weight:600}
.sheetbg{position:fixed;inset:0;background:rgba(10,25,20,.5);z-index:40;display:none}.sheetbg.on{display:block}
.psheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:none}.psheet.on{display:block}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;transition:transform .3s;max-width:90%;text-align:center}.toast.on{transform:translateX(-50%) translateY(0)}
.doc .rm,.card .rm{color:var(--red);font-weight:700;font-size:13px;margin-top:6px}
.lst{display:block}
@media(min-width:900px){body{max-width:940px}.tabs{max-width:940px}.psheet{max-width:560px}.lst{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.grid2{grid-template-columns:repeat(4,1fr)}main{padding-left:24px;padding-right:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Hosirx brand: graphite, green, electric blue */
header{background:#25272B;position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#1FB339,#1688FF);border-radius:0 0 22px 22px}
h1,h2,h3{font-family:Sora,Figtree,sans-serif}
.emb{display:block;flex:none;width:40px;height:35px;background:var(--emb) center/contain no-repeat}
.brand{display:flex;align-items:center;gap:8px;font-family:Sora,sans-serif;font-size:21px}
.wm{font-family:Sora,sans-serif;font-weight:800;letter-spacing:-.03em}.wm b{color:#1FB339}.wm i{color:#1688FF;font-style:normal}
.brand .pt{font-weight:600;font-size:15px;color:#C9CBD0;font-family:Figtree,sans-serif;margin-left:2px}
.toast{top:auto!important;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(180px)!important}.toast.on{transform:translateX(-50%) translateY(0)!important}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand" aria-label="Hosirx Partners"><span class="emb" aria-hidden="true"></span><span class="wm"><b>Hosi</b><i>rx</i></span><span class="pt">Partners</span></div><a class="back" href="index.html">Customer app</a></div>
  <p id="hp">Sell medicine or offer care to patients near you.</p>
  <div class="bar" id="bar"><i id="bi"></i></div>
</header>
<main id="app"></main>

<script src="hs-core.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var QS=new URLSearchParams(location.search),DEMO=QS.get("demo")||"",WEB=QS.get("web")==="1",TYPE=QS.get("type")||"";
var STATES=["Lagos","FCT Abuja","Rivers","Oyo","Kano","Enugu","Edo","Kaduna","Ogun","Delta","Anambra","Other"];
var BANKS=["Access Bank","GTBank","First Bank","UBA","Zenith Bank","Opay","Moniepoint","Kuda","Other"];
function M(id,l,r,hint){return {id:id,l:l,t:"text",v:"money",r:r,h:hint}}
var DEPTS=["General","Emergency","Paediatrics","Maternity","Cardiology","Surgery","Dental","Eye","Mental health"];

/* ---------- Step definitions (the marketplace frame) ---------- */
var BIZ=[
 {id:"name",l:"Business name",t:"text",r:1},
 {id:"state",l:"State",t:"select",o:STATES,r:1},
 {id:"city",l:"City or area",t:"text",r:1},
 {id:"addr",l:"Street address",t:"text",r:1,h:"Riders and patients use this to find you."},
 {id:"phone",l:"Business phone",t:"tel",r:1,v:"phone"},
 {id:"email",l:"Email",t:"email",r:1,v:"email"},
 {id:"cac",l:"CAC registration number",t:"text",r:1,h:"Example: RC 1234567"}
];
var PAY=[
 {id:"bank",l:"Bank",t:"select",o:BANKS,r:1},
 {id:"acct",l:"Account number",t:"tel",r:1,v:"acct",h:"10 digits. Payouts go to this account."},
 {id:"acctName",l:"Account name",t:"text",r:1,h:"Must match your business or director name."}
];
var FLOW={
 pharm:{label:"Pharmacy",steps:[
  {title:"Business details",sub:"Tell us who you are.",f:BIZ},
  {title:"Licences and compliance",sub:"We verify every pharmacy before it goes live.",f:[
   {id:"prem",l:"PCN premises licence number",t:"text",r:1},
   {id:"sup",l:"Superintendent pharmacist name",t:"text",r:1},
   {id:"supNo",l:"Pharmacist PCN registration number",t:"text",r:1},
   {id:"fCac",l:"CAC certificate",t:"file",r:1},
   {id:"fPrem",l:"Premises licence",t:"file",r:1},
   {id:"fPharm",l:"Pharmacist licence",t:"file",r:1},
   {id:"nafdac",l:"I confirm every product I list is NAFDAC-registered.",t:"check",r:1},
   {id:"ctrl",l:"I will not sell controlled drugs without a verified prescription.",t:"check",r:1}]},
  {title:"How you operate",sub:"Set your hours and delivery area.",f:[
   {id:"hours",l:"Opening hours",t:"select",o:["Open 24 hours","7am – 9pm","8am – 10pm","Custom"],r:1},
   {id:"radius",l:"Delivery radius",t:"select",o:["Up to 3 km","Up to 5 km","Up to 10 km"],r:1},
   {id:"prep",l:"Usual preparation time",t:"select",o:["Under 10 min","10–20 min","20–30 min"],r:1},
   {id:"rx",l:"I accept prescription orders and will verify them before dispatch.",t:"check"}]},
  {title:"Consultation fees",sub:"Pharmacist consultations open a video, voice or chat room. "+"You set the price. Patients pay it through the payment gateway before the appointment is confirmed. You can change it, and add more appointment types, later in your dashboard.",f:[M("fVideo","Video consultation (₦)",1,"Example: 2000"),M("fVoice","Voice call (₦)",1),M("fChat","Chat (₦)",1)]},
  {title:"Payout account",sub:"Where we send your earnings.",f:PAY}]},
 hosp:{label:"Hospital",steps:[
  {title:"Facility details",sub:"Tell us who you are.",f:BIZ},
  {title:"Licences and compliance",sub:"We verify every facility before it goes live.",f:[
   {id:"lic",l:"State Ministry of Health facility licence number",t:"text",r:1},
   {id:"dir",l:"Medical director name",t:"text",r:1},
   {id:"dirNo",l:"Medical director MDCN number",t:"text",r:1},
   {id:"fCac",l:"CAC certificate",t:"file",r:1},
   {id:"fLic",l:"Facility licence",t:"file",r:1},
   {id:"terms",l:"I confirm all listed doctors hold a valid MDCN licence.",t:"check",r:1}]},
  {title:"Services",sub:"What patients can reach you for.",f:[
   {id:"ftype",l:"Facility type",t:"select",o:["General hospital","Specialist hospital","Maternity centre","Clinic"],r:1},
   {id:"em",l:"We offer 24/7 emergency care.",t:"check"},
   {id:"emPhone",l:"Emergency phone line",t:"tel",r:1,v:"phone",h:"Patients tap this to call you directly."},
   {id:"amb",l:"We have an ambulance.",t:"check"},
   {id:"depts",l:"Departments",t:"chips",o:DEPTS,r:1},
   {id:"modes",l:"Consultation options",t:"chips",o:["Video","Chat","In person"],r:1}]},
  {title:"Doctors",sub:"Add at least one doctor patients can book.",f:[{id:"docs",t:"docs",r:1}]},
  {title:"Consultation fees",sub:"You set the price. Patients pay it through the payment gateway before the appointment is confirmed. You can change it, and add more appointment types, later in your dashboard.",f:[M("fVideo","Video consultation (₦)",1,"Example: 8000"),M("fVoice","Voice call (₦)",1),M("fChat","Chat (₦)",1),M("fIn","In-person visit (₦)",1),M("fEmerg","Emergency consultation (₦)",1,"Charged for non-life-threatening emergency bookings."),M("fFollow","Follow-up visit (₦)",1),M("fSpec","Specialist consultation (₦)",0,"Optional"),M("fAnte","Antenatal or maternity visit (₦)",0,"Optional"),M("fReg","New patient registration (₦)",0,"Optional. Charged once when a patient registers with you on the website or app.")]},
  {title:"Payout account",sub:"Where we send consultation earnings.",f:PAY}]}
};

/* ---------- State ---------- */
var S={type:null,step:0,d:{},err:{},docs:[{n:"",m:"",s:""}]};
try{var sv=JSON.parse(localStorage.getItem("hs_partner")||"null");if(sv&&sv.type){S.type=sv.type;S.d=sv.d||{};S.step=sv.step||0;S.ref=sv.ref;S.stage=sv.stage||0;if(sv.docs&&sv.docs.length)S.docs=sv.docs}}catch(e){}
function save(){if(DEMO)return;try{localStorage.setItem("hs_partner",JSON.stringify({type:S.type,d:S.d,step:S.step,docs:S.docs,ref:S.ref,stage:S.stage}))}catch(e){}}
/* Demo accounts (index.html?demo): an approved partner, held in memory only, never saved */
var SEEDS={
 pharm:{type:"pharm",ref:"HS-PH-DEMO1",d:{name:"HealthPlus Pharmacy",state:"Lagos",city:"Ikeja",addr:"12 Allen Avenue",phone:"08000000002",email:"demo.pharmacy@hosirx.demo",fVideo:"2000",fVoice:"1500",fChat:"1000",bank:"GTBank",acct:"0123456789",acctName:"HealthPlus Pharmacy Ltd"}},
 hosp:{type:"hosp",ref:"HS-HO-DEMO1",d:{name:"Lagoon General Hospital",state:"Lagos",city:"Ikeja",addr:"5 Obafemi Awolowo Way",phone:"08000000003",email:"demo.hospital@hosirx.demo",em:true,amb:true,emPhone:"08000000001",fVideo:"8000",fVoice:"6000",fChat:"4000",fIn:"10000",fEmerg:"15000",fFollow:"5000",fSpec:"12000",fAnte:"9000",fReg:"3000",bank:"Access Bank",acct:"0987654321",acctName:"Lagoon General Hospital Ltd"},docs:[{n:"Dr. Adeyemi",m:"MDCN 11111",s:"GP"},{n:"Dr. Okafor",m:"MDCN 22222",s:"Paediatrics"}]}
};
if(SEEDS[DEMO]){var sd=SEEDS[DEMO];S.type=sd.type;S.d=sd.d;S.ref=sd.ref;S.stage=3;S.step=99;if(sd.docs)S.docs=sd.docs}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function flow(){return FLOW[S.type]}
/* Embedded inside the Hosirx sign-in page (index.html?embed=apply|portal) */
var EMB=new URLSearchParams(location.search).get("embed")||"",IN=window.parent!==window&&(EMB==="apply"||EMB==="portal");
if(IN){
  var bk0=document.querySelector(".back");
  bk0.textContent=EMB==="portal"?"Sign out":"Back";bk0.setAttribute("href","#");
  bk0.onclick=function(e){e.preventDefault();window.parent.postMessage({hs:"partner-exit"},"*")};
}
function theme(){document.body.classList.toggle("hosp",S.type==="hosp")}

/* ---------- Validation ---------- */
function bad(f){
  var v=S.d[f.id];
  if(f.t==="docs"){var ok=S.docs.some(function(x){return x.n.trim()&&x.m.trim()&&x.s.trim()});return ok?"":"Add at least one doctor with name, MDCN number and specialty."}
  if(f.t==="chips")return f.r&&!(v&&v.length)?"Pick at least one.":"";
  if(f.t==="check")return f.r&&!v?"Please confirm to continue.":"";
  if(f.t==="file")return f.r&&!v?"Upload this document.":"";
  if(f.r&&!String(v||"").trim())return "Required.";
  var s=String(v||"").replace(/[\s,]/g,"");
  if(f.v==="money")return s&&!/^\d{3,7}$/.test(s)?"Enter an amount in naira, e.g. 5000.":"";
  if(f.v==="phone"&&!/^(\+234|0)\d{10}$/.test(s))return "Use a Nigerian number, e.g. 0803 123 4567.";
  if(f.v==="email"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s))return "Enter a valid email.";
  if(f.v==="acct"&&!/^\d{10}$/.test(s))return "Account number must be 10 digits.";
  return "";
}

/* ---------- Render ---------- */
function field(f){
  var v=S.d[f.id],e=S.err[f.id],h="";
  if(f.t==="check")h='<label class="chk"><input type="checkbox" data-k="'+f.id+'"'+(v?' checked':'')+'><span>'+f.l+'</span></label>';
  else if(f.t==="file")h='<div class="l">'+f.l+'</div><label class="up"><span>'+(v?'<span class="ok">✔ '+esc(v)+'</span>':'Tap to upload photo or PDF')+'</span><input type="file" data-k="'+f.id+'" accept="image/*,.pdf"></label>';
  else if(f.t==="select")h='<label for="'+f.id+'">'+f.l+'</label><select id="'+f.id+'" data-k="'+f.id+'"><option value="">Select</option>'+f.o.map(function(o){return '<option'+(v===o?' selected':'')+'>'+o+'</option>'}).join("")+'</select>';
  else if(f.t==="chips")h='<div class="l">'+f.l+'</div><div class="chips">'+f.o.map(function(o){return '<button type="button" class="chip'+((v||[]).indexOf(o)>-1?' on':'')+'" data-c="'+f.id+'" data-o="'+o+'">'+o+'</button>'}).join("")+'</div>';
  else if(f.t==="docs")h=S.docs.map(function(d,i){return '<div class="doc"><input placeholder="Doctor name" data-d="'+i+'" data-p="n" value="'+esc(d.n)+'"><input placeholder="MDCN number" data-d="'+i+'" data-p="m" value="'+esc(d.m)+'"><input placeholder="Specialty, e.g. Paediatrics" data-d="'+i+'" data-p="s" value="'+esc(d.s)+'">'+(S.docs.length>1?'<button type="button" class="rm" data-rm="'+i+'">Remove</button>':'')+'</div>'}).join("")+'<button type="button" class="btn out" id="addDoc">Add another doctor</button>';
  else if(f.v==="money")h='<label for="'+f.id+'">'+f.l+'</label><input id="'+f.id+'" type="text" inputmode="numeric" data-k="'+f.id+'" value="'+esc(v)+'" placeholder="e.g. 5000" autocomplete="off">';
  else h='<label for="'+f.id+'">'+f.l+'</label><input id="'+f.id+'" type="'+f.t+'" data-k="'+f.id+'" value="'+esc(v)+'" autocomplete="off">';
  return '<div class="f'+(e?' err':'')+'">'+h+(f.h&&!e?'<small>'+f.h+'</small>':'')+(e?'<div class="msg">'+e+'</div>':'')+'</div>';
}

function render(){
  theme();var app=$("#app");app.classList.remove("tp");
  if(!S.type&&(TYPE==="pharm"||TYPE==="hosp")){S.type=TYPE;S.step=0;S.d={};S.err={};save()}
  if(!S.type){
    $("#bar").style.display="none";$("#hp").textContent="Sell medicine or offer care to patients near you.";
    app.innerHTML='<h2>Join Hosirx</h2><p class="sub">Choose how you want to work with us.</p>'+
    '<button class="pick p" data-t="pharm"><span class="em">💊</span><b>I run a pharmacy</b><span>Receive orders, verify prescriptions, and hand over to riders for delivery.</span></button>'+
    '<button class="pick h" data-t="hosp"><span class="em">🏥</span><b>I run a hospital or clinic</b><span>Get found nearby, take emergency calls, and offer consultations.</span></button>'+
    '<div class="perks"><div>Verified partners only</div><div>Weekly payouts</div><div>Riders included</div><div>Free to list</div></div>'+
    '<p class="note">Takes about 10 minutes. Have your CAC and licence documents ready. Progress saves on this device.</p>';
    document.querySelectorAll(".pick").forEach(function(b){b.onclick=function(){S.type=b.dataset.t;S.step=0;S.d={};S.err={};save();render();scrollTo(0,0)}});
    return;
  }
  var fl=flow(),n=fl.steps.length;
  if(S.step>=n+1){return done()}
  $("#bar").style.display="block";
  $("#hp").textContent=fl.label+" onboarding · Step "+Math.min(S.step+1,n+1)+" of "+(n+1);
  $("#bi").style.width=((S.step+1)/(n+1)*100)+"%";
  if(S.step===n){return review()}
  var st=fl.steps[S.step];
  app.innerHTML='<h2>'+st.title+'</h2><p class="sub">'+st.sub+'</p>'+st.f.map(field).join("")+
   '<div class="row">'+(S.step>0?'<button class="btn out" id="bk">Back</button>':'<button class="btn out" id="chg">Change type</button>')+'<button class="btn" id="nx">Continue</button></div>';
  bind(st);
}

function bind(st){
  document.querySelectorAll("[data-k]").forEach(function(el){
    el.onchange=el.oninput=function(){
      var k=el.dataset.k;
      if(el.type==="checkbox")S.d[k]=el.checked;
      else if(el.type==="file"){if(el.files[0]){S.d[k]=el.files[0].name;save();render();return}}
      else S.d[k]=el.value;
      save();
    };
  });
  document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){var k=b.dataset.c,a=S.d[k]||[],i=a.indexOf(b.dataset.o);i>-1?a.splice(i,1):a.push(b.dataset.o);S.d[k]=a;save();b.classList.toggle("on")}});
  document.querySelectorAll("[data-d]").forEach(function(el){el.oninput=function(){S.docs[+el.dataset.d][el.dataset.p]=el.value;save()}});
  document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){S.docs.splice(+b.dataset.rm,1);save();render()}});
  var ad=$("#addDoc");if(ad)ad.onclick=function(){S.docs.push({n:"",m:"",s:""});save();render()};
  var bk=$("#bk");if(bk)bk.onclick=function(){S.step--;S.err={};save();render();scrollTo(0,0)};
  var ch=$("#chg");if(ch)ch.onclick=function(){S.type=null;save();render()};
  $("#nx").onclick=function(){
    S.err={};var first=null;
    st.f.forEach(function(f){var m=bad(f);if(m){S.err[f.id]=m;if(!first)first=f.id}});
    if(first){render();var el=document.querySelector(".f.err");if(el)el.scrollIntoView({block:"center"});return}
    S.step++;save();render();scrollTo(0,0);
  };
}

function review(){
  var fl=flow(),h='<h2>Review and submit</h2><p class="sub">Check your details. You can go back to edit.</p>';
  fl.steps.forEach(function(st,i){
    h+='<div class="rev"><h3>'+st.title+'</h3>'+st.f.map(function(f){
      if(f.t==="docs")return S.docs.filter(function(d){return d.n}).map(function(d){return '<div><span>'+esc(d.n)+'</span><b>'+esc(d.s)+'</b></div>'}).join("");
      var v=S.d[f.id];if(f.t==="check")v=v?"Confirmed":"No";if(f.t==="chips")v=(v||[]).join(", ");if(f.v==="money"&&v)v="₦"+Number(String(v).replace(/,/g,"")).toLocaleString("en-NG");
      var lab=f.t==="check"?f.l.replace(/^I (confirm |will |accept |)/,"").slice(0,38)+"…":f.l;
      return '<div><span>'+esc(lab)+'</span><b>'+esc(v||"—")+'</b></div>'}).join("")+'</div>';
  });
  h+='<div class="f"><label class="chk"><input type="checkbox" id="agree"><span>I agree to the Hosirx partner terms and confirm the information above is true.</span></label><div class="msg" id="am" hidden>Please agree to submit.</div></div>'+
   '<div class="row"><button class="btn out" id="bk">Back</button><button class="btn" id="sub">Submit for review</button></div>';
  $("#app").innerHTML=h;
  $("#bk").onclick=function(){S.step--;save();render();scrollTo(0,0)};
  $("#sub").onclick=function(){if(!$("#agree").checked){$("#am").hidden=false;return}S.step++;S.ref="HS-"+(S.type==="pharm"?"PH":"HO")+"-"+Math.floor(10000+Math.random()*90000);S.stage=0;save();render();scrollTo(0,0)};
}

function done(){
  if(S.stage>=3&&!(IN&&EMB==="apply"))return dash();
  $("#bar").style.display="block";$("#bi").style.width="100%";
  var pharm=S.type==="pharm";
  var ST=["Application received",pharm?"Documents checked (CAC, PCN premises, pharmacist)":"Documents checked (CAC, facility licence, MDCN)","Verification call and address check",pharm?"Approved. Add your drug catalogue":"Approved. Your profile goes live"];
  $("#hp").textContent=S.stage>=3?"Partner account":"Application submitted";
  $("#app").innerHTML=(S.stage>=3?'<h2>Welcome, '+esc(S.d.name||"partner")+'</h2><p class="sub">You are approved and verified.'+(DEMO?' This is a demo account.':'')+'</p>':'<h2>Thanks, '+esc(S.d.name||"partner")+'</h2><p class="sub">We are reviewing your application. Most reviews take 1–3 working days. This demo speeds it up.</p>')+

      (b.phone?'<div class="s" style="margin-top:4px">📞 '+esc(b.phone)+(b.hn&&b.kind!=="reg"?' · No. '+esc(b.hn):'')+'</div>':'')+(A?'<div class="acts">'+A+'</div>':'')+'</div>'
  }).join("")):empty(P.bookings.length?"Nothing here right now.":"No visits yet. Patients can book, register and pay once your doctors have open slots and your fees are set."));
}
function slotBtn(d,i,t){
  var b=P.bookings.some(function(x){return x.doc===dl(d)&&x.slot===t&&x.st!=="noshow"}),off=d.off.indexOf(t)>-1;
  return '<button class="slotb '+(b?"bk":off?"off":"on")+'"'+(b?' disabled':'')+' data-a="slot" data-i="'+i+'|'+t+'">'+t+(b?'<small>Booked</small>':'')+'</button>';
}
function vDocs(){
  var h='<button class="btn" data-a="dadd" style="margin:0 0 12px">+ Add doctor</button>';
  return h+(P.docs.length?lst(P.docs.map(function(d,i){
    return '<div class="card"><div class="r"><div><div class="t">'+esc(d.n)+'</div><div class="s">'+esc(d.s||"General")+(d.m?" · "+esc(d.m):"")+'</div></div>'+sw("dtog",d.on,"Accepting bookings: "+esc(d.n),i)+'</div>'+
      '<div class="s" style="margin-top:10px">'+(d.on?"Tap a time to open or block it today.":"Not accepting bookings")+'</div>'+
      (d.on?'<div class="sl">'+TIMES.map(function(t){return slotBtn(d,i,t)}).join("")+'</div>':'')+
      (P.docs.length>1?'<button class="rm" data-a="ddel" data-i="'+i+'">Remove doctor</button>':'')+'</div>'
  }).join("")):empty("Add at least one doctor patients can book."));
}
function vEarn(){
  var ph=S.type==="pharm",today=0,cnt=0;
  if(ph){P.orders.forEach(function(o){if(o.st==="done"){today+=osub(o);cnt++}});P.consults.forEach(function(c){if(c.st==="completed"){today+=c.fee;cnt++}})}
  else P.bookings.forEach(function(b){if(b.st==="completed"){today+=b.fee;cnt++}});
  var a=P.pay.acct,keys=Object.keys(P.fees);
  var h='<div class="grid2"><div class="stat"><span class="s">'+(ph?"Sales today":"Earned today")+'</span><b>'+naira(today)+'</b></div><div class="stat"><span class="s">'+(ph?"Completed today":"Visits completed")+'</span><b>'+cnt+'</b></div>'+
    '<div class="stat"><span class="s">Pending payout</span><b>'+naira(today+P.carry)+'</b></div><div class="stat"><span class="s">Last payout</span><b>'+(P.last?naira(P.last):"—")+'</b></div></div>'+
    '<div class="card" style="margin-top:12px"><div class="t">Payout account</div><div class="s" style="margin-top:4px">'+(a?esc(P.pay.bank)+" · ····"+esc(a.slice(-4))+"<br>"+esc(P.pay.name):"Not set")+'</div><div class="s" style="margin-top:6px">Paid out weekly.</div></div>'+
    '<div class="card"><div class="t">'+(ph?"Consultation fees":"Appointment fees")+'</div><div class="s" style="margin:4px 0 12px">You set the price for each appointment type. Patients pay it through the payment gateway before the booking or consultation is confirmed.</div>'+
    keys.map(function(k,i){return '<div class="f"><label for="fe'+i+'">'+esc(HS.label(k))+' (₦)</label><div class="r"><input id="fe'+i+'" type="text" inputmode="numeric" data-fk="'+esc(k)+'" value="'+P.fees[k]+'" autocomplete="off">'+(!ph&&keys.length>1?'<button class="rm" style="margin:0" data-a="fdel" data-i="'+i+'" aria-label="Remove '+esc(HS.label(k))+'">Remove</button>':'')+'</div></div>'}).join("")+
    (keys.length?'<button class="btn" data-a="fsave">Save fees</button>':empty("No fees set."));
  if(!ph){
    var free=HS.TYPES.filter(function(t){return !(t in P.fees)});
    h+='<div class="s" style="margin:14px 0 6px;font-weight:700;color:var(--ink)">Add an appointment type</div><div class="f"><label for="nt">Type (pick one or type your own, e.g. Dental check)</label><input id="nt" type="text" list="ntl" autocomplete="off" placeholder="e.g. Specialist"><datalist id="ntl">'+free.map(function(t){return '<option value="'+esc(t)+'">'+esc(HS.label(t))+'</option>'}).join("")+'</datalist></div>'+
      '<div class="f"><label for="nf">Fee (₦)</label><input id="nf" type="text" inputmode="numeric" placeholder="e.g. 8000" autocomplete="off"></div><button class="btn out" data-a="fadd">Add type</button>';
  }
  h+='</div>';
  if(DEMO)h+='<button class="btn out" data-a="reset">Reset demo data</button><p class="note">Demo data lives on this device only.</p>';
  return h;
}

/* ----- sheets ----- */
function openSh(h){$("#psh").innerHTML=h;$("#psh").classList.add("on");$("#sbg").classList.add("on");SH=true}
function closeSh(){var p=$("#psh");if(!p)return;p.classList.remove("on");p.innerHTML="";$("#sbg").classList.remove("on");SH=false}
function serr(m){var e=$("#serr");if(e){e.textContent=m;e.hidden=false}}
function stockSheet(id){
  var s=id?stkId(id):{n:"",c:"Other",k:"",p:"",q:"",rx:0};
  openSh('<h3 style="margin-bottom:12px">'+(id?"Edit medicine":"Add medicine")+'</h3>'+
   '<div class="f"><label for="sn">Name and strength</label><input id="sn" type="text" value="'+esc(s.n)+'" placeholder="e.g. Paracetamol 500mg"></div>'+
   '<div class="f"><label for="sc">Category</label><select id="sc">'+CATS.map(function(c){return '<option'+(c===s.c?' selected':'')+'>'+c+'</option>'}).join("")+'</select></div>'+
   '<div class="f"><label for="sk">Pack size</label><input id="sk" type="text" value="'+esc(s.k)+'" placeholder="e.g. Pack of 20"></div>'+
   '<div class="row"><div class="f"><label for="sp">Price (₦)</label><input id="sp" type="text" inputmode="numeric" value="'+esc(s.p)+'"></div><div class="f"><label for="sq">In stock</label><input id="sq" type="text" inputmode="numeric" value="'+esc(s.q)+'"></div></div>'+
   '<div class="f"><label class="chk"><input type="checkbox" id="srx"'+(s.rx?' checked':'')+'><span>Needs a prescription</span></label></div>'+
   '<div class="msg" id="serr" role="alert" hidden></div>'+
   '<div class="row"><button class="btn out" data-a="x">Cancel</button><button class="btn" data-a="ssave" data-i="'+(id||"")+'">Save</button></div>'+
   (id?'<button class="btn out" style="color:var(--red);border-color:var(--red)" data-a="sdel" data-i="'+id+'">Remove from catalogue</button>':''));
}
function docSheet(){
  openSh('<h3 style="margin-bottom:12px">Add doctor</h3>'+
   '<div class="f"><label for="dn">Doctor name</label><input id="dn" type="text" placeholder="e.g. Dr. Ngozi Eze"></div>'+
   '<div class="f"><label for="dm">MDCN number</label><input id="dm" type="text"></div>'+
   '<div class="f"><label for="ds">Specialty</label><input id="ds" type="text" placeholder="e.g. Paediatrics"></div>'+
   '<div class="msg" id="serr" role="alert" hidden></div>'+
   '<div class="row"><button class="btn out" data-a="x">Cancel</button><button class="btn" data-a="dsave">Add doctor</button></div>');
}

/* ----- consultation rooms (app only) ----- */
function loadRoom(cb){if(window.HS_ROOM)return cb();var s=document.createElement("script");s.src="hs-room.js";s.onload=cb;s.onerror=function(){toast("Could not load the consultation room")};document.head.appendChild(s)}
function openRoom(id,mode,name){loadRoom(function(){HS_ROOM.open({id:id,role:"host",mode:mode,name:name})})}

/* ----- actions ----- */
function onClick(e){var b=e.target.closest("[data-a]");if(b&&!b.disabled)act(b.dataset.a,b.dataset.i)}
function setO(o,st,msg){o.st=st;mo(o);pSave();draw();if(msg)toast(msg)}
function act(a,i){
  var o,b,c,d,s,v,p;
  switch(a){
  case "tab":TB=i;draw();scrollTo(0,0);return;
  case "of":OF=i;draw();return;
  case "sf":SF=i;draw();return;
  case "bf":BF=i;draw();return;
  case "x":closeSh();return;
  case "online":P.online=!P.online;pSave();draw();toast(P.online?"You are online":"You are offline");return;
  case "rx":o=ord(i);openSh('<h3 style="margin-bottom:12px">Prescription · '+esc(o.id)+'</h3><div class="card"><div class="t">📄 '+esc(o.rxName||("prescription-"+o.id+".jpg"))+'</div><div class="s" style="margin-top:6px">Check the patient name, drug, dose and prescriber details before you approve.</div></div><div class="row"><button class="btn out" data-a="rxno" data-i="'+esc(o.id)+'">Reject</button><button class="btn" data-a="rxok" data-i="'+esc(o.id)+'">Approve</button></div>');return;
  case "rxok":ord(i).rxOk=true;closeSh();pSave();draw();toast("Prescription approved");return;
  case "rxno":closeSh();setO(ord(i),"rejected","Order declined");return;
  case "acc":
    o=ord(i);
    v=o.items.filter(function(it){var x=stk(it.n);return x&&x.q<it.q})[0];
    if(v){toast("Not enough "+v.n+" in stock");return}
    o.items.forEach(function(it){var x=stk(it.n);if(x)x.q-=it.q});
    setO(o,"preparing","Order accepted. Start preparing");return;
  case "dec":setO(ord(i),"rejected","Order declined");return;
  case "rdy":o=ord(i);o.rider=pick(RIDERS);setO(o,"ready","Rider "+o.rider+" is coming to collect");return;
  case "out":setO(ord(i),"out","Handed to rider");return;
  case "dlv":setO(ord(i),"done","Order delivered");return;
  case "stog":s=stkId(i);s.on=s.on?0:1;pSave();draw();return;
  case "sadd":stockSheet("");return;
  case "sedit":stockSheet(i);return;
  case "ssave":
    var nm=$("#sn").value.trim(),pr=$("#sp").value.replace(/[\s,]/g,""),qt=$("#sq").value.replace(/[\s,]/g,"");
    if(!nm)return serr("Enter the medicine name.");
    if(!/^\d{2,7}$/.test(pr))return serr("Enter the price in naira, e.g. 1500.");
    if(!/^\d{1,5}$/.test(qt))return serr("Enter how many you have in stock.");
    s=i?stkId(i):null;
    if(!s){s={id:P.stock.reduce(function(m,x){return Math.max(m,x.id)},0)+1,on:1};P.stock.push(s)}
    s.n=nm;s.c=$("#sc").value;s.k=$("#sk").value.trim();s.p=+pr;s.q=+qt;s.rx=$("#srx").checked?1:0;
    closeSh();pSave();draw();toast(i?"Medicine updated":"Medicine added");return;
  case "sdel":P.stock=P.stock.filter(function(x){return String(x.id)!==String(i)});closeSh();pSave();draw();toast("Removed from catalogue");return;
  case "cstart":c=cons(i);c.st="inprogress";mv(c.id,"inprogress");pSave();draw();openRoom(c.id,c.mode,c.who);return;
  case "croom":c=cons(i);openRoom(c.id,c.mode,c.who);return;
  case "cdone":c=cons(i);c.st="completed";mv(c.id,"completed");pSave();draw();toast("Consultation completed");return;
  case "t24":P.open24=!P.open24;pSave();draw();return;
  case "tamb":P.amb=!P.amb;pSave();draw();return;
  case "ack":P.alerts.filter(function(x){return x.id===i})[0].st="ack";pLocal();draw();toast("Patient notified that help is coming");return;
  case "amb":toast("Ambulance dispatched");return;
  case "res":P.alerts.filter(function(x){return x.id===i})[0].st="done";pLocal();draw();return;
  case "bst":b=bk(i);b.st="inprogress";mv(b.id,"inprogress");pSave();draw();if(HS.isLive(b.mode)&&!WEB)openRoom(b.id,b.mode,b.pat);else toast("Patient checked in");return;
  case "broom":b=bk(i);openRoom(b.id,b.mode,b.pat);return;
  case "bdone":b=bk(i);b.st="completed";mv(b.id,"completed");pSave();draw();toast("Visit completed");return;
  case "bns":b=bk(i);b.st="noshow";mv(b.id,"noshow");pSave();draw();return;
  case "dtog":d=P.docs[+i];d.on=d.on?0:1;pSave();draw();return;
  case "slot":p=i.split("|");d=P.docs[+p[0]];v=d.off.indexOf(p[1]);if(v>-1)d.off.splice(v,1);else d.off.push(p[1]);pSave();draw();return;
  case "dadd":docSheet();return;
  case "dsave":
    if(!$("#dn").value.trim()||!$("#dm").value.trim()||!$("#ds").value.trim())return serr("Add the doctor's name, MDCN number and specialty.");
    P.docs.push({n:$("#dn").value.trim(),m:$("#dm").value.trim(),s:$("#ds").value.trim(),on:1,off:[]});closeSh();pSave();draw();toast("Doctor added");return;
  case "ddel":P.docs.splice(+i,1);pSave();draw();return;
  case "fsave":
    var inp=document.querySelectorAll("[data-fk]"),nf={},ok=true;
    inp.forEach(function(el){var n=el.value.replace(/[\s,]/g,"");if(/^\d{3,7}$/.test(n))nf[el.dataset.fk]=+n;else ok=false});
    if(!ok){toast("Enter amounts in naira, e.g. 5000");return}
    for(var k in nf)P.fees[k]=nf[k];pSave();toast("Fees updated. Patients now pay these amounts");return;
  case "fadd":
    var tn=$("#nt").value.trim().replace(/\s+/g," "),tf=$("#nf").value.replace(/[\s,]/g,"");
    var std=HS.TYPES.filter(function(t){return t.toLowerCase()===tn.toLowerCase()})[0];if(std)tn=std;
    if(!/^[A-Za-z][A-Za-z0-9 &'\/-]{1,29}$/.test(tn)){toast("Enter a type name, e.g. Dental check");return}
    if(Object.keys(P.fees).some(function(k){return k.toLowerCase()===tn.toLowerCase()})){toast(tn+" is already in your list");return}
    if(!/^\d{3,7}$/.test(tf)){toast("Enter the fee in naira, e.g. 8000");return}
    P.fees[tn]=+tf;pSave();draw();toast(tn+" added at "+naira(+tf));return;
  case "fdel":
    var fk=Object.keys(P.fees)[+i];if(fk&&Object.keys(P.fees).length>1){delete P.fees[fk];pSave();draw();toast(fk+" removed")}return;
  case "reset":
    try{localStorage.removeItem(PK)}catch(e){}
    var ff=HS.get("hs_fees",{});delete ff[pid()];HS.put("hs_fees",ff);var ss=HS.get("hs_stock",{});delete ss[pid()];HS.put("hs_stock",ss);
    P=null;simN=0;OF="new";SF="all";BF="up";pLoad();pull();pPublish();TB=tabs()[0].id;draw();toast("Demo data reset");return;
  }
}

/* ----- demo: extra orders and bookings arrive while you watch ----- */
function simOrder(){
  var av=P.stock.filter(function(s){return s.on&&s.q>0});if(!av.length)return "";
  var a=pick(av),b=pick(av),items=[{n:a.n,q:1,p:a.p}];if(b!==a)items.push({n:b.n,q:1,p:b.p});
  var o={id:oid("HS"),cust:pick(NAMES),addr:"Ikeja, Lagos",items:items,rx:(a.rx||b.rx)?1:0,rxOk:false,st:"new",t:Date.now()};
  P.orders.unshift(o);return o.id;
}
function simBooking(){
  var modes=["Video","Voice","Chat","In person"].filter(function(m){return P.fees[m]}),free=[];
  P.docs.forEach(function(d){if(!d.on)return;TIMES.forEach(function(t){if(d.off.indexOf(t)<0&&!P.bookings.some(function(b){return b.doc===dl(d)&&b.slot===t&&b.st!=="noshow"}))free.push([d,t])})});
  if(!free.length||!modes.length)return "";
  var f=pick(free),m=pick(modes),b={id:oid("BK"),pat:pick(NAMES),doc:dl(f[0]),mode:m,slot:f[1],fee:P.fees[m],st:"confirmed",t:Date.now()};
  P.bookings.push(b);return b.id;
}
function startSim(){
  if(!DEMO||simT)return;
  simT=setTimeout(function tick(){
    var ph=S.type==="pharm";
    if(simN<3&&(!ph||P.online)){
      var id=ph?simOrder():simBooking();
      if(id){simN++;pLocal();toast((ph?"New order ":"New booking ")+id);refresh()}
    }
    if(simN<3)simT=setTimeout(tick,30000);
  },9000);
}
function refresh(){var ae=document.activeElement;if($("#pv")&&!SH&&!(ae&&/INPUT|SELECT/.test(ae.tagName)))draw()}

function tabNav(){
  return '<nav class="tabs" aria-label="Sections">'+tabs().map(function(t){var n=bd(t.id);return '<button class="'+(t.id===TB?"on":"")+'" data-a="tab" data-i="'+t.id+'">'+svg(t.i)+t.l+(n?'<span class="bd">'+n+'</span>':'')+'</button>'}).join("")+'</nav>';
}
function draw(){
  var v={orders:vOrders,stock:vStock,cons:vCons,earn:vEarn,book:vBook,docs:vDocs}[TB];
  $("#app").innerHTML='<div id="pv">'+v()+'</div>'+tabNav();
}
function dash(){
  theme();if(!P)pLoad();
  $("#app").classList.add("tp");$("#bar").style.display="none";
  $("#hp").textContent=(DEMO?"Demo account · ":"")+(S.d.name||flow().label);
  if(!tabs().some(function(t){return t.id===TB}))TB=tabs()[0].id;
  if(!$("#psh")){document.body.insertAdjacentHTML("beforeend",'<div class="sheetbg" id="sbg"></div><div class="psheet" id="psh" role="dialog" aria-modal="true"></div>');$("#sbg").onclick=closeSh;$("#psh").onclick=onClick}
  $("#app").onclick=onClick;
  var fresh=pull();pPublish();
  HS.beat(pid());if(!beatT)beatT=setInterval(function(){HS.beat(pid())},5000);
  if(!hooked){hooked=true;HS.onChange(function(){var f=pull();if(f.length){toast("New "+f[0]);refresh()}})}
  draw();startSim();
  if(fresh.length)toast("New "+fresh[0]);
}


render();
})();
</script>
