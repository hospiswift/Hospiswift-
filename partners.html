<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospiswift Partners – Join as a pharmacy or hospital</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0B7A55;--green-d:#085C41;--green-l:#E3F4EC;--blue:#1565C0;--blue-d:#0D47A1;--blue-l:#E4EEFB;--red:#D32F2F;--ink:#10231C;--mute:#5D6F68;--line:#DCE6E1;--bg:#F5F9F7;
--a:var(--green);--ad:var(--green-d);--al:var(--green-l)}
body.hosp{--a:var(--blue);--ad:var(--blue-d);--al:var(--blue-l);--bg:#F4F8FD;--line:#D9E4F2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
header{background:var(--a);color:#fff;padding:16px;border-radius:0 0 22px 22px;transition:background .3s}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:20px}.back{color:#fff;font-size:14px;font-weight:600;text-decoration:none;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px}
header p{font-size:14px;opacity:.92;margin-top:10px}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:12px;overflow:hidden;display:none}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
main{padding:16px 16px 40px}
h2{font-size:20px;font-weight:800;margin-bottom:4px}.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.pick{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.pick b{font-size:18px;display:block;margin:6px 0 4px}.pick span{font-size:14px;color:var(--mute)}
.pick.p{border-color:var(--green)}.pick.h{border-color:var(--blue)}
.pick .em{font-size:28px}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.perks div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px;font-weight:600}
.f{margin-bottom:14px}.f label,.f .l{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.f small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.f input[type=text],.f input[type=tel],.f input[type=email],.f select,.f textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.f.err input,.f.err select,.f.err .up{border-color:var(--red)}
.msg{color:var(--red);font-size:12px;font-weight:600;margin-top:4px}
.up{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px dashed var(--a);border-radius:12px;padding:12px;background:#fff;cursor:pointer;font-weight:600;color:var(--ad);font-size:14px}
.up input{display:none}.up .ok{color:var(--green);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--a);flex:none}
.f.err .chk{border-color:var(--red)}
.doc{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.doc input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px}
.doc .rm{color:var(--red);font-weight:700;font-size:13px}
.btn{background:var(--a);color:#fff;font-weight:700;padding:14px;border-radius:12px;width:100%;margin-top:6px}
.btn.out{background:#fff;color:var(--a);border:1.5px solid var(--a)}
.row{display:flex;gap:10px}.row>*{flex:1}
.rev{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
.rev h3{font-size:14px;color:var(--ad);margin-bottom:6px}.rev div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.rev span{color:var(--mute)}.rev b{text-align:right;word-break:break-word}
.steps{list-style:none;margin:14px 0}
.steps li{padding:10px 0 10px 32px;position:relative;color:var(--mute);font-size:15px}
.steps li:before{content:"";position:absolute;left:4px;top:13px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff}
.steps li.done{color:var(--ink);font-weight:600}.steps li.done:before{background:var(--a);border-color:var(--a)}
.steps li.now:before{border-color:var(--a);box-shadow:0 0 0 4px var(--al)}
.ref{background:var(--al);color:var(--ad);font-weight:800;border-radius:12px;padding:10px;text-align:center;letter-spacing:1px}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand">Hospiswift Partners</div><a class="back" href="index.html">Customer app</a></div>
  <p id="hp">Sell medicine or offer care to patients near you.</p>
  <div class="bar" id="bar"><i id="bi"></i></div>
</header>
<main id="app"></main>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var STATES=["Lagos","FCT Abuja","Rivers","Oyo","Kano","Enugu","Edo","Kaduna","Ogun","Delta","Anambra","Other"];
var BANKS=["Access Bank","GTBank","First Bank","UBA","Zenith Bank","Opay","Moniepoint","Kuda","Other"];
function M(id,l,r,hint){return {id:id,l:l,t:"text",v:"money",r:r,h:hint}}
var DEPTS=["General","Emergency","Paediatrics","Maternity","Cardiology","Surgery","Dental","Eye","Mental health"];

/* ---------- Step definitions (the marketplace frame) ---------- */
var BIZ=[
 {id:"name",l:"Business name",t:"text",r:1},
 {id:"state",l:"State",t:"select",o:STATES,r:1},
 {id:"city",l:"City or area",t:"text",r:1},
 {id:"addr",l:"Street address",t:"text",r:1,h:"Riders and patients use this to find you."},
 {id:"phone",l:"Business phone",t:"tel",r:1,v:"phone"},
 {id:"email",l:"Email",t:"email",r:1,v:"email"},
 {id:"cac",l:"CAC registration number",t:"text",r:1,h:"Example: RC 1234567"}
];
var PAY=[
 {id:"bank",l:"Bank",t:"select",o:BANKS,r:1},
 {id:"acct",l:"Account number",t:"tel",r:1,v:"acct",h:"10 digits. Payouts go to this account."},
 {id:"acctName",l:"Account name",t:"text",r:1,h:"Must match your business or director name."}
];
var FLOW={
 pharm:{label:"Pharmacy",steps:[
  {title:"Business details",sub:"Tell us who you are.",f:BIZ},
  {title:"Licences and compliance",sub:"We verify every pharmacy before it goes live.",f:[
   {id:"prem",l:"PCN premises licence number",t:"text",r:1},
   {id:"sup",l:"Superintendent pharmacist name",t:"text",r:1},
   {id:"supNo",l:"Pharmacist PCN registration number",t:"text",r:1},
   {id:"fCac",l:"CAC certificate",t:"file",r:1},
   {id:"fPrem",l:"Premises licence",t:"file",r:1},
   {id:"fPharm",l:"Pharmacist licence",t:"file",r:1},
   {id:"nafdac",l:"I confirm every product I list is NAFDAC-registered.",t:"check",r:1},
   {id:"ctrl",l:"I will not sell controlled drugs without a verified prescription.",t:"check",r:1}]},
  {title:"How you operate",sub:"Set your hours and delivery area.",f:[
   {id:"hours",l:"Opening hours",t:"select",o:["Open 24 hours","7am – 9pm","8am – 10pm","Custom"],r:1},
   {id:"radius",l:"Delivery radius",t:"select",o:["Up to 3 km","Up to 5 km","Up to 10 km"],r:1},
   {id:"prep",l:"Usual preparation time",t:"select",o:["Under 10 min","10–20 min","20–30 min"],r:1},
   {id:"rx",l:"I accept prescription orders and will verify them before dispatch.",t:"check"}]},
  {title:"Consultation fees",sub:"Pharmacist consultations open a video, voice or chat room. "+"You set the price. Patients pay it in the app before the appointment is confirmed. You can change it later.",f:[M("fVideo","Video consultation (₦)",1,"Example: 2000"),M("fVoice","Voice call (₦)",1),M("fChat","Chat (₦)",1)]},
  {title:"Payout account",sub:"Where we send your earnings.",f:PAY}]},
 hosp:{label:"Hospital",steps:[
  {title:"Facility details",sub:"Tell us who you are.",f:BIZ},
  {title:"Licences and compliance",sub:"We verify every facility before it goes live.",f:[
   {id:"lic",l:"State Ministry of Health facility licence number",t:"text",r:1},
   {id:"dir",l:"Medical director name",t:"text",r:1},
   {id:"dirNo",l:"Medical director MDCN number",t:"text",r:1},
   {id:"fCac",l:"CAC certificate",t:"file",r:1},
   {id:"fLic",l:"Facility licence",t:"file",r:1},
   {id:"terms",l:"I confirm all listed doctors hold a valid MDCN licence.",t:"check",r:1}]},
  {title:"Services",sub:"What patients can reach you for.",f:[
   {id:"ftype",l:"Facility type",t:"select",o:["General hospital","Specialist hospital","Maternity centre","Clinic"],r:1},
   {id:"em",l:"We offer 24/7 emergency care.",t:"check"},
   {id:"emPhone",l:"Emergency phone line",t:"tel",r:1,v:"phone",h:"Patients tap this to call you directly."},
   {id:"amb",l:"We have an ambulance.",t:"check"},
   {id:"depts",l:"Departments",t:"chips",o:DEPTS,r:1},
   {id:"modes",l:"Consultation options",t:"chips",o:["Video","Chat","In person"],r:1}]},
  {title:"Doctors",sub:"Add at least one doctor patients can book.",f:[{id:"docs",t:"docs",r:1}]},
  {title:"Consultation fees",sub:"You set the price. Patients pay it in the app before the appointment is confirmed. You can change it later.",f:[M("fVideo","Video consultation (₦)",1,"Example: 8000"),M("fVoice","Voice call (₦)",1),M("fChat","Chat (₦)",1),M("fIn","In-person visit (₦)",1),M("fEmerg","Emergency consultation (₦)",1,"Charged for non-life-threatening emergency bookings."),M("fFollow","Follow-up visit (₦)",1),M("fSpec","Specialist consultation (₦)",0,"Optional"),M("fAnte","Antenatal or maternity visit (₦)",0,"Optional")]},
  {title:"Payout account",sub:"Where we send consultation earnings.",f:PAY}]}
};

/* ---------- State ---------- */
var S={type:null,step:0,d:{},err:{},docs:[{n:"",m:"",s:""}]};
try{var sv=JSON.parse(localStorage.getItem("hs_partner")||"null");if(sv&&sv.type){S.type=sv.type;S.d=sv.d||{};S.step=sv.step||0;if(sv.docs&&sv.docs.length)S.docs=sv.docs}}catch(e){}
function save(){try{localStorage.setItem("hs_partner",JSON.stringify({type:S.type,d:S.d,step:S.step,docs:S.docs}))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function flow(){return FLOW[S.type]}
function theme(){document.body.classList.toggle("hosp",S.type==="hosp")}

/* ---------- Validation ---------- */
function bad(f){
  var v=S.d[f.id];
  if(f.t==="docs"){var ok=S.docs.some(function(x){return x.n.trim()&&x.m.trim()&&x.s.trim()});return ok?"":"Add at least one doctor with name, MDCN number and specialty."}
  if(f.t==="chips")return f.r&&!(v&&v.length)?"Pick at least one.":"";
  if(f.t==="check")return f.r&&!v?"Please confirm to continue.":"";
  if(f.t==="file")return f.r&&!v?"Upload this document.":"";
  if(f.r&&!String(v||"").trim())return "Required.";
  var s=String(v||"").replace(/[\s,]/g,"");
  if(f.v==="money")return s&&!/^\d{3,7}$/.test(s)?"Enter an amount in naira, e.g. 5000.":"";
  if(f.v==="phone"&&!/^(\+234|0)\d{10}$/.test(s))return "Use a Nigerian number, e.g. 0803 123 4567.";
  if(f.v==="email"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s))return "Enter a valid email.";
  if(f.v==="acct"&&!/^\d{10}$/.test(s))return "Account number must be 10 digits.";
  return "";
}

/* ---------- Render ---------- */
function field(f){
  var v=S.d[f.id],e=S.err[f.id],h="";
  if(f.t==="check")h='<label class="chk"><input type="checkbox" data-k="'+f.id+'"'+(v?' checked':'')+'><span>'+f.l+'</span></label>';
  else if(f.t==="file")h='<div class="l">'+f.l+'</div><label class="up"><span>'+(v?'<span class="ok">✔ '+esc(v)+'</span>':'Tap to upload photo or PDF')+'</span><input type="file" data-k="'+f.id+'" accept="image/*,.pdf"></label>';
  else if(f.t==="select")h='<label for="'+f.id+'">'+f.l+'</label><select id="'+f.id+'" data-k="'+f.id+'"><option value="">Select</option>'+f.o.map(function(o){return '<option'+(v===o?' selected':'')+'>'+o+'</option>'}).join("")+'</select>';
  else if(f.t==="chips")h='<div class="l">'+f.l+'</div><div class="chips">'+f.o.map(function(o){return '<button type="button" class="chip'+((v||[]).indexOf(o)>-1?' on':'')+'" data-c="'+f.id+'" data-o="'+o+'">'+o+'</button>'}).join("")+'</div>';
  else if(f.t==="docs")h=S.docs.map(function(d,i){return '<div class="doc"><input placeholder="Doctor name" data-d="'+i+'" data-p="n" value="'+esc(d.n)+'"><input placeholder="MDCN number" data-d="'+i+'" data-p="m" value="'+esc(d.m)+'"><input placeholder="Specialty, e.g. Paediatrics" data-d="'+i+'" data-p="s" value="'+esc(d.s)+'">'+(S.docs.length>1?'<button type="button" class="rm" data-rm="'+i+'">Remove</button>':'')+'</div>'}).join("")+'<button type="button" class="btn out" id="addDoc">Add another doctor</button>';
  else if(f.v==="money")h='<label for="'+f.id+'">'+f.l+'</label><input id="'+f.id+'" type="text" inputmode="numeric" data-k="'+f.id+'" value="'+esc(v)+'" placeholder="e.g. 5000" autocomplete="off">';
  else h='<label for="'+f.id+'">'+f.l+'</label><input id="'+f.id+'" type="'+f.t+'" data-k="'+f.id+'" value="'+esc(v)+'" autocomplete="off">';
  return '<div class="f'+(e?' err':'')+'">'+h+(f.h&&!e?'<small>'+f.h+'</small>':'')+(e?'<div class="msg">'+e+'</div>':'')+'</div>';
}

function render(){
  theme();var app=$("#app");
  if(!S.type){
    $("#bar").style.display="none";$("#hp").textContent="Sell medicine or offer care to patients near you.";
    app.innerHTML='<h2>Join Hospiswift</h2><p class="sub">Choose how you want to work with us.</p>'+
    '<button class="pick p" data-t="pharm"><span class="em">💊</span><b>I run a pharmacy</b><span>Receive orders, verify prescriptions, and hand over to riders for delivery.</span></button>'+
    '<button class="pick h" data-t="hosp"><span class="em">🏥</span><b>I run a hospital or clinic</b><span>Get found nearby, take emergency calls, and offer consultations.</span></button>'+
    '<div class="perks"><div>Verified partners only</div><div>Weekly payouts</div><div>Riders included</div><div>Free to list</div></div>'+
    '<p class="note">Takes about 10 minutes. Have your CAC and licence documents ready. Progress saves on this device.</p>';
    document.querySelectorAll(".pick").forEach(function(b){b.onclick=function(){S.type=b.dataset.t;S.step=0;S.d={};S.err={};save();render();scrollTo(0,0)}});
    return;
  }
  var fl=flow(),n=fl.steps.length;
  if(S.step>=n+1){return done()}
  $("#bar").style.display="block";
  $("#hp").textContent=fl.label+" onboarding · Step "+Math.min(S.step+1,n+1)+" of "+(n+1);
  $("#bi").style.width=((S.step+1)/(n+1)*100)+"%";
  if(S.step===n){return review()}
  var st=fl.steps[S.step];
  app.innerHTML='<h2>'+st.title+'</h2><p class="sub">'+st.sub+'</p>'+st.f.map(field).join("")+
   '<div class="row">'+(S.step>0?'<button class="btn out" id="bk">Back</button>':'<button class="btn out" id="chg">Change type</button>')+'<button class="btn" id="nx">Continue</button></div>';
  bind(st);
}

function bind(st){
  document.querySelectorAll("[data-k]").forEach(function(el){
    el.onchange=el.oninput=function(){
      var k=el.dataset.k;
      if(el.type==="checkbox")S.d[k]=el.checked;
      else if(el.type==="file"){if(el.files[0]){S.d[k]=el.files[0].name;save();render();return}}
      else S.d[k]=el.value;
      save();
    };
  });
  document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){var k=b.dataset.c,a=S.d[k]||[],i=a.indexOf(b.dataset.o);i>-1?a.splice(i,1):a.push(b.dataset.o);S.d[k]=a;save();b.classList.toggle("on")}});
  document.querySelectorAll("[data-d]").forEach(function(el){el.oninput=function(){S.docs[+el.dataset.d][el.dataset.p]=el.value;save()}});
  document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){S.docs.splice(+b.dataset.rm,1);save();render()}});
  var ad=$("#addDoc");if(ad)ad.onclick=function(){S.docs.push({n:"",m:"",s:""});save();render()};
  var bk=$("#bk");if(bk)bk.onclick=function(){S.step--;S.err={};save();render();scrollTo(0,0)};
  var ch=$("#chg");if(ch)ch.onclick=function(){S.type=null;save();render()};
  $("#nx").onclick=function(){
    S.err={};var first=null;
    st.f.forEach(function(f){var m=bad(f);if(m){S.err[f.id]=m;if(!first)first=f.id}});
    if(first){render();var el=document.querySelector(".f.err");if(el)el.scrollIntoView({block:"center"});return}
    S.step++;save();render();scrollTo(0,0);
  };
}

function review(){
  var fl=flow(),h='<h2>Review and submit</h2><p class="sub">Check your details. You can go back to edit.</p>';
  fl.steps.forEach(function(st,i){
    h+='<div class="rev"><h3>'+st.title+'</h3>'+st.f.map(function(f){
      if(f.t==="docs")return S.docs.filter(function(d){return d.n}).map(function(d){return '<div><span>'+esc(d.n)+'</span><b>'+esc(d.s)+'</b></div>'}).join("");
      var v=S.d[f.id];if(f.t==="check")v=v?"Confirmed":"No";if(f.t==="chips")v=(v||[]).join(", ");if(f.v==="money"&&v)v="₦"+Number(String(v).replace(/,/g,"")).toLocaleString("en-NG");
      var lab=f.t==="check"?f.l.replace(/^I (confirm |will |accept |)/,"").slice(0,38)+"…":f.l;
      return '<div><span>'+esc(lab)+'</span><b>'+esc(v||"—")+'</b></div>'}).join("")+'</div>';
  });
  h+='<div class="f"><label class="chk"><input type="checkbox" id="agree"><span>I agree to the Hospiswift partner terms and confirm the information above is true.</span></label><div class="msg" id="am" hidden>Please agree to submit.</div></div>'+
   '<div class="row"><button class="btn out" id="bk">Back</button><button class="btn" id="sub">Submit for review</button></div>';
  $("#app").innerHTML=h;
  $("#bk").onclick=function(){S.step--;save();render();scrollTo(0,0)};
  $("#sub").onclick=function(){if(!$("#agree").checked){$("#am").hidden=false;return}S.step++;S.ref="HS-"+(S.type==="pharm"?"PH":"HO")+"-"+Math.floor(10000+Math.random()*90000);S.stage=0;save();render();scrollTo(0,0)};
}

function done(){
  $("#bar").style.display="block";$("#bi").style.width="100%";
  var pharm=S.type==="pharm";
  var ST=["Application received",pharm?"Documents checked (CAC, PCN premises, pharmacist)":"Documents checked (CAC, facility licence, MDCN)","Verification call and address check",pharm?"Approved. Add your drug catalogue":"Approved. Your profile goes live"];
  $("#hp").textContent="Application submitted";
  $("#app").innerHTML='<h2>Thanks, '+esc(S.d.name||"partner")+'</h2><p class="sub">We are reviewing your application. Most reviews take 1–3 working days. This demo speeds it up.</p>'+
   '<div class="ref">'+S.ref+'</div><ul class="steps" id="st">'+ST.map(function(s,i){return '<li class="'+(i<S.stage?'done':i===S.stage?'now':'')+'">'+s+'</li>'}).join("")+'</ul>'+
   (S.stage>=3?'<div class="rev"><h3>Next</h3><div><span>'+(pharm?'Upload stock, set prices, switch to online and start receiving orders.':'Confirm your emergency line and doctor slots, then go live to nearby patients.')+'</span></div></div>':'')+
   '<button class="btn out" id="rs">Start a new application</button>';
  $("#rs").onclick=function(){S={type:null,step:0,d:{},err:{},docs:[{n:"",m:"",s:""}]};save();render()};
  if(S.stage<3){clearTimeout(done.t);done.t=setTimeout(function(){S.stage++;save();done()},2500)}
}

render();
})();
</script>
</body>
</html>
